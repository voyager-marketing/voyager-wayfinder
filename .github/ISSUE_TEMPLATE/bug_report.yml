name: Bug report
description: Wayfinder shows something wrong, misses something, or breaks.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through private reporting instead (see SECURITY.md).
        Please leave out anything private: client names, URLs you can't share, credentials and option values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest way to see it, ideally on a fresh wp-env site or one of the fixtures.
      placeholder: |
        1. Activate theme ... and plugin ...
        2. Run `wp wayfinder scan`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where you saw it
      multiple: true
      options:
        - Wayfinder page in wp-admin
        - REST (wayfinder/v1)
        - Abilities or MCP
        - WP-CLI
        - Notes
        - Benchmark (bench/)
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: The part of the manual, find result or error that is wrong. Trim it to what matters.
      render: text
  - type: input
    id: wayfinder-version
    attributes:
      label: Wayfinder version
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress and PHP versions
      placeholder: WordPress 7.1.2, PHP 8.3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Theme and relevant plugins
      description: The active theme (block or classic, child of what) and any builder or fields plugin involved.
